left:
  retargeting:
    type: vector

    urdf_path: hands/inspire_hand/inspire_hand_left.urdf

    # Wrist link name of the hand in URDF, note: this frame should be consistent with operator frame convention
    wrist_link_name: "base"

    # Target refers to the retargeting target, which is the robot hand
    target_joint_names: [ 'pinky_proximal_joint', 'ring_proximal_joint', 'middle_proximal_joint', 'index_proximal_joint',
                        'thumb_proximal_pitch_joint', 'thumb_proximal_yaw_joint' ]
    target_origin_link_names: [ "base", "base", "base", "base", "base" ]
    target_task_link_names: [ "thumb_tip",  "index_tip", "middle_tip", "ring_tip", "pinky_tip" ]
    scaling_factor: 1.15

    # Source refers to the retargeting input, which usually corresponds to the human hand
    # The joint indices of human hand joint which corresponds to each link in the target_link_names
    target_link_human_indices: [ [ 0, 0, 0, 0, 0 ], [ 4, 8, 12, 16, 20 ] ]

    # Low pass filter for hand
    # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
    low_pass_alpha: 0.4

  control:
    type: pinocchio

    robot_name: rm75_inspire_left

    # Config path with more details about the robot and its kinematics
    robot_config_path: rm75_inspire_left.yml

    # Low pass filter for arm
    # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
    low_pass_alpha: 0.05

    # Set True if you do not want to control the orientation of hand
    disable_orientation_control: False

    # Set to a smaller value for first trial before you are familiar with the system
    # In most cases, it should be smaller than 1
    motion_scaling_factor: 1.0

right:
  retargeting:
    type: vector

    urdf_path: hands/inspire_hand/inspire_hand_right.urdf

    wrist_link_name: "base"

    target_joint_names: [ 'pinky_proximal_joint', 'ring_proximal_joint', 'middle_proximal_joint', 'index_proximal_joint',
                        'thumb_proximal_pitch_joint', 'thumb_proximal_yaw_joint' ]
    target_origin_link_names: [ "base", "base", "base", "base", "base" ]
    target_task_link_names: [ "thumb_tip",  "index_tip", "middle_tip", "ring_tip", "pinky_tip", ]
    scaling_factor: 1.0

    target_link_human_indices: [ [ 0, 0, 0, 0, 0 ], [ 4, 8, 12, 16, 20 ] ]

    low_pass_alpha: 0.4

  control:
    type: pinocchio

    robot_name: rm75_inspire_right

    robot_config_path: rm75_inspire_right.yml

    low_pass_alpha: 0.05

    disable_orientation_control: False

    motion_scaling_factor: 1.0
